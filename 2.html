   <script>
let Conta= Number(prompt("Qual o valor da Conta?"))
let Pessoas = Number(prompt("Quantas pessoas comeram?"))
let serviço = Conta * 0.1
let total = Conta + serviço
let porPessoa = total / Pessoas

console.log("Total de serviço: R$" + total)
console.log("Cada Pessoa vai pagar: R$" + porPessoa)

   </script>
